name: ci
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package opswarden-api --package opswarden-detector
      - name: Ruff lint
        run: uvx ruff check .
      - name: Tests
        run: uv run --with pytest --package opswarden-api pytest packages/opswarden_core/tests services/api/tests -q

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core ansible-lint
      - name: ansible-lint (syntax + best practices)
        run: ansible-lint ansible/ || true   # advisory in CI

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (render + validate)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for d in deploy/elastic deploy/openldap deploy/agent; do
            kubectl kustomize "$d" 2>/dev/null | ./kubeconform -ignore-missing-schemas -strict -summary || true
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config + secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
