[defaults]
inventory = inventory/gcp.yml
host_key_checking = False
retry_files_enabled = False
result_format = yaml
callback_result_format = yaml
interpreter_python = /usr/bin/python3
timeout = 60
remote_user = soroosh
private_key_file = ~/.ssh/google_compute_engine
roles_path = roles

[ssh_connection]
pipelining = True
# No public IPs on the VMs: every SSH hop is tunnelled through Identity-Aware Proxy.
# %h is the instance name (see inventory compose), %p the port.
ssh_args = -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=us-central1-a --project=opswarden-lab 2>/dev/null" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
