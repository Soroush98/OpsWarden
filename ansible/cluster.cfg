# In-cluster Ansible config: connect straight to the app-server VMs over the VPC as opsagent
# (no IAP), using a static inventory of their fixed private IPs. Selected by the agent runner
# via OPSWARDEN_ANSIBLE_CONFIG=cluster.cfg.
[defaults]
inventory = inventory/cluster_hosts.ini
host_key_checking = False
remote_user = opsagent
private_key_file = /secrets/opsagent_key
interpreter_python = /usr/bin/python3
timeout = 60
result_format = yaml
callback_result_format = yaml
roles_path = roles

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
