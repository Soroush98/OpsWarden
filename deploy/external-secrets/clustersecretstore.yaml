# One store for the whole cluster. ESO authenticates to Secret Manager with the controller's
# Workload Identity (GSA external-secrets@opswarden-lab), which is granted secretAccessor on
# exactly the OpsWarden secrets in Terraform. No JSON key anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: opswarden-lab
