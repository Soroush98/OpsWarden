# Passwords and TLS material pulled from Secret Manager into the identity namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-passwords
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openldap-passwords
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef: { key: ldap-admin-password }
    - secretKey: sssd-bind-password
      remoteRef: { key: ldap-sssd-bind-password }
    - secretKey: seed-user-password
      remoteRef: { key: ldap-seed-user-password }
    - secretKey: svc-backup-password
      remoteRef: { key: ldap-svc-backup-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-tls
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openldap-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: ca.crt
      remoteRef: { key: internal-ca-cert }
    - secretKey: tls.crt
      remoteRef: { key: ldap-server-cert }
    - secretKey: tls.key
      remoteRef: { key: ldap-server-key }
