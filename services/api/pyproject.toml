[project]
name = "opswarden-api"
version = "0.1.0"
description = "OpsWarden agent API: LangGraph propose->approve->execute with read-only ES tools"
requires-python = ">=3.12"
dependencies = [
    "opswarden-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic[vertex]>=0.40",
    "ldap3>=2.9",
    "itsdangerous>=2.2",
]

[project.scripts]
opswarden-api = "opswarden_api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opswarden_api"]

[tool.uv.sources]
opswarden-core = { workspace = true }
