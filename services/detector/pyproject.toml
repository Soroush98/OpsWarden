[project]
name = "opswarden-detector"
version = "0.1.0"
description = "Elasticsearch anomaly detector for OpsWarden"
requires-python = ">=3.12"
dependencies = [
    "opswarden-core",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.scripts]
opswarden-detector = "detector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detector"]

[tool.uv.sources]
opswarden-core = { workspace = true }
